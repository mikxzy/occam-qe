name: qe-convergence-probe
# DEL A: run ONE frozen SCF job from queue/jobs.json (scripts/make_convergence_matrix.py)
# on a GitHub-hosted runner. Physics/settings are frozen in the repo (runs/convergence/**,
# queue/jobs.json); this workflow only provides compute and records the environment.
# Mirrors test4b-qe-probe.yml in rcm-spr-test4b-compute.

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Job id from queue/jobs.json (e.g. scf_ecut60_k4)
        required: true
      np:
        description: MPI ranks
        default: "4"
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: condaforge/miniforge3:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Install QE (same pinned conda-forge build as rcm-spr-test4b-compute)
        run: |
          mamba install -y -c conda-forge "qe=7.5=h19104ac_2" "openmpi=5.0.10=hee33aa4_2" "libopenblas=0.3.34=pthreads_hf13c14d_2" "fftw=3.3.11=nompi_h3b011a4_100" "scalapack=2.2.0=h606478a_6" "elpa=2025.06.001=mpi_openmpi_h335e491_1" numpy
          mamba clean -afy
          ln -s "$GITHUB_WORKSPACE/pseudo" /work_pseudo
          mkdir -p /work && ln -s "$GITHUB_WORKSPACE/pseudo" /work/pseudo
          nproc; grep -E 'MemTotal|MemAvailable' /proc/meminfo
      - name: Run frozen job ${{ inputs.job_id }}
        env:
          OMPI_ALLOW_RUN_AS_ROOT: "1"
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python scripts/run_qe_job.py --job "${{ inputs.job_id }}" --np "${{ inputs.np }}" --out "artifacts/${{ inputs.job_id }}" || echo "run_qe_job exit $?"
          cat "artifacts/${{ inputs.job_id }}/result.json" | head -80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.job_id }}
          path: artifacts/${{ inputs.job_id }}
          if-no-files-found: error
          retention-days: 90
