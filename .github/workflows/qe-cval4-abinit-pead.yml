name: qe-cval4-abinit-pead
# C-VAL4 Step 2: ABINIT PEAD purely-electronic (clamped-ion) nonlinear response,
# elfd-elfd-elfd only, at the exact QE CVAL3_G1_k8 geometry/cutoff/k-grid/pseudos.
# Do not run before Step 1 (qe-cval4-abinit-gs.yml) has confirmed ground-state parity.

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: CVAL4_abinit_pead_G1
        default: CVAL4_abinit_pead_G1
        required: true
      np:
        description: MPI ranks
        default: "4"
        required: true

jobs:
  abinit_pead:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    container:
      image: condaforge/miniforge3:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Install ABINIT
        run: |
          mamba install -y -c conda-forge "abinit=10.0.3" numpy
          mamba clean -afy
          mkdir -p /work && ln -s "$GITHUB_WORKSPACE/pseudo" /work/pseudo
          abinit --version
      - name: Run ${{ inputs.job_id }}
        env:
          OMP_NUM_THREADS: "1"
        run: |
          python scripts/run_cval4_abinit_pead.py --job "${{ inputs.job_id }}" --np "${{ inputs.np }}" --out "artifacts/${{ inputs.job_id }}" || echo "exit $?"
          cat "artifacts/${{ inputs.job_id }}/result.json" | head -150
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delC-${{ inputs.job_id }}
          path: artifacts/${{ inputs.job_id }}
          if-no-files-found: error
          retention-days: 90
