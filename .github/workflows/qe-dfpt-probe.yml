name: qe-dfpt-probe
# DEL A completion: run ONE frozen scf+DFPT(Gamma) job from queue/dfpt_jobs.json
# (scripts/make_dfpt_matrix.py) -- dielectric tensor + Gamma phonon frequencies, to check
# their convergence at 80/100/120 Ry (the resolved production cutoff). Same hash-verified
# frozen-job pattern as qe-convergence-probe.yml, but longer timeout: DFPT is substantially
# more expensive than a plain SCF run.

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Job id from queue/dfpt_jobs.json (e.g. dfpt_ecut100_k4)
        required: true
      np:
        description: MPI ranks
        default: "4"
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    container:
      image: condaforge/miniforge3:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Install QE (same pinned conda-forge build as rcm-spr-test4b-compute)
        run: |
          mamba install -y -c conda-forge "qe=7.5=h19104ac_2" "openmpi=5.0.10=hee33aa4_2" "libopenblas=0.3.34=pthreads_hf13c14d_2" "fftw=3.3.11=nompi_h3b011a4_100" "scalapack=2.2.0=h606478a_6" "elpa=2025.06.001=mpi_openmpi_h335e491_1" numpy
          mamba clean -afy
          mkdir -p /work && ln -s "$GITHUB_WORKSPACE/pseudo" /work/pseudo
          nproc; grep -E 'MemTotal|MemAvailable' /proc/meminfo
      - name: Run frozen job ${{ inputs.job_id }}
        env:
          OMPI_ALLOW_RUN_AS_ROOT: "1"
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python scripts/run_dfpt_job.py --job "${{ inputs.job_id }}" --np "${{ inputs.np }}" --out "artifacts/${{ inputs.job_id }}" || echo "run_dfpt_job exit $?"
          cat "artifacts/${{ inputs.job_id }}/result.json" | head -120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.job_id }}
          path: artifacts/${{ inputs.job_id }}
          if-no-files-found: error
          retention-days: 90
